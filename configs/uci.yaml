name: UCI
data_dir: data/UCI
zip_path: data/UCI/UCI.zip
input_shape: [128, 9]
num_classes: 6

model:
  in_channels: 1
  layers:
    - {kernel_size: [6, 1], stride: [3, 1], out_channels: 16}
    - {kernel_size: [3, 1], stride: [1, 1], out_channels: 16}
    - {kernel_size: [6, 1], stride: [3, 1], out_channels: 64}
    - {kernel_size: [3, 1], stride: [1, 1], out_channels: 64}
    - {kernel_size: [6, 1], stride: [3, 1], out_channels: 128}
  exit_layers: [2, 3, 4, 5]
  ensemble_mode: ensemble

dataloader:
  train_shuffle: false
  test_shuffle: false
